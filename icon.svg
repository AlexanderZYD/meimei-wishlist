<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9a8b8"/>
      <stop offset="100%" style="stop-color:#e8607a"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>
  <!-- background -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>
  <!-- white checklist icon -->
  <!-- paper -->
  <rect x="148" y="128" width="216" height="260" rx="18" ry="18" fill="rgba(255,255,255,0.95)"/>
  <!-- check lines -->
  <!-- line 1 checked -->
  <rect x="190" y="182" width="16" height="16" rx="4" fill="#e8607a"/>
  <polyline points="192,190 196,195 204,185" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="218" y="185" width="90" height="8" rx="4" fill="#f0c0c8"/>
  <!-- line 2 checked -->
  <rect x="190" y="218" width="16" height="16" rx="4" fill="#e8607a"/>
  <polyline points="192,226 196,231 204,221" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="218" y="221" width="70" height="8" rx="4" fill="#f0c0c8"/>
  <!-- line 3 unchecked -->
  <rect x="190" y="254" width="16" height="16" rx="4" fill="none" stroke="#f0c0c8" stroke-width="2"/>
  <rect x="218" y="257" width="100" height="8" rx="4" fill="#f5d5da"/>
  <!-- line 4 unchecked -->
  <rect x="190" y="290" width="16" height="16" rx="4" fill="none" stroke="#f0c0c8" stroke-width="2"/>
  <rect x="218" y="293" width="80" height="8" rx="4" fill="#f5d5da"/>
  <!-- small heart -->
  <path d="M244,340 C244,334 250,330 256,335 C262,330 268,334 268,340 C268,346 256,355 256,355 C256,355 244,346 244,340Z" fill="#e8607a"/>
</svg>
